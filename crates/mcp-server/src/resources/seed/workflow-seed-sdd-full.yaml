apiVersion: workflows.local/v1
kind: Workflow
metadata:
  uid: ""
  arn: arn:local:global:workflow/seed-sdd-full
  name: seed-sdd-full
  scope: global
  labels:
    seed: "true"
    sdd: "true"
  annotations:
    description: "Full SDD lifecycle — 8 stages canonical"
spec:
  description: Complete Spec-Driven Development lifecycle with all 8 stages
  stages:
    - id: explore
      agent: arn:local:global:agent/sdd-explore
      depends_on: []
      description: Explore and investigate the change
      input: {}
      output:
        artifacts: []
      execution:
        mode: sequential
        retry:
          max_attempts: 1
          backoff_ms: 0
      conditions: []
      metrics: []
    - id: propose
      agent: arn:local:global:agent/sdd-propose
      depends_on: ["explore"]
      description: Create change proposal
      input: {}
      output:
        artifacts: []
      execution:
        mode: sequential
        retry:
          max_attempts: 1
          backoff_ms: 0
      conditions: []
      metrics: []
    - id: design
      agent: arn:local:global:agent/sdd-design
      depends_on: ["propose"]
      description: Produce architecture and design decisions
      input: {}
      output:
        artifacts: []
      execution:
        mode: sequential
        retry:
          max_attempts: 1
          backoff_ms: 0
      conditions: []
      metrics: []
    - id: spec
      agent: arn:local:global:agent/sdd-spec
      depends_on: ["design"]
      description: Write detailed specifications and scenarios
      input: {}
      output:
        artifacts: []
      execution:
        mode: sequential
        retry:
          max_attempts: 1
          backoff_ms: 0
      conditions: []
      metrics: []
    - id: tasks
      agent: arn:local:global:agent/sdd-tasks
      depends_on: ["spec"]
      description: Break down into actionable work units
      input: {}
      output:
        artifacts: []
      execution:
        mode: sequential
        retry:
          max_attempts: 1
          backoff_ms: 0
      conditions: []
      metrics: []
    - id: apply
      agent: arn:local:global:agent/sdd-apply
      depends_on: ["tasks"]
      description: Implement the change
      input: {}
      output:
        artifacts: []
      execution:
        mode: sequential
        retry:
          max_attempts: 1
          backoff_ms: 0
      conditions: []
      metrics: []
    - id: verify
      agent: arn:local:global:agent/sdd-verify
      depends_on: ["apply"]
      description: Validate implementation against specs
      input: {}
      output:
        artifacts: []
      execution:
        mode: sequential
        retry:
          max_attempts: 1
          backoff_ms: 0
      conditions: []
      metrics: []
    - id: archive
      agent: arn:local:global:agent/sdd-archive
      depends_on: ["verify"]
      description: Close loop and persist artifacts
      input: {}
      output:
        artifacts: []
      execution:
        mode: sequential
        retry:
          max_attempts: 1
          backoff_ms: 0
      conditions: []
      metrics: []
  execution:
    mode: sequential
    on_failure: abort
  metrics:
    streaming: false
    interval_ms: 5000
    channels: ["execution"]
