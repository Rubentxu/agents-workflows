# Code Review Skill

## Overview
This skill performs automated code review using static analysis and pattern matching.

## Triggers
- "code review"
- "review code"
- "analyze code"

## Required Tools
- bash
- read

## Behavior
Analyzes code for:
- Style violations
- Potential bugs
- Security issues
- Performance concerns
