apiVersion: tools.local/v1
kind: Tool
metadata:
  uid: ""
  arn: arn:local:global:tool/seed-validate
  name: seed-validate
  scope: global
  labels:
    seed: "true"
  annotations:
    description: "Validation tool for testing"
spec:
  description: Validation tool for testing
  input_schema:
    type: object
    properties:
      code:
        type: string
        description: Code to validate
      language:
        type: string
        description: Programming language
    required:
      - code
  category: validation
  tags:
    - testing
    - validation
