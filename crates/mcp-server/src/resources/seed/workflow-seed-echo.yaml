apiVersion: workflows.local/v1
kind: Workflow
metadata:
  uid: ""
  arn: arn:local:global:workflow/seed-echo
  name: seed-echo
  scope: global
  labels:
    seed: "true"
  annotations:
    description: "Simple echo workflow for testing"
spec:
  description: Simple echo workflow for testing
  stages:
    - id: echo
      agent: ""
      depends_on: []
      description: Echo Input
      input:
        text:
          template: "echo {{input}}"
      output:
        artifacts: []
      execution:
        mode: sequential
        retry:
          max_attempts: 1
          backoff_ms: 0
      conditions: []
      metrics: []
  execution:
    mode: sequential
    on_failure: abort
  metrics:
    streaming: false
    interval_ms: 5000
    channels: []
